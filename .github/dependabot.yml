# Version updates for what Dependabot can see: the pinned GitHub Actions and the Dockerfile base-image digests
# (app/Dockerfile, tools/Dockerfile.dev). The pip installs are inline in the Dockerfiles, so they are not covered here.
# Dependabot only opens PRs; merging one means pulling it onto main like any other commit (tests green first).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "konbini: "
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - "/app"
      - "/tools"
    schedule:
      interval: weekly
    commit-message:
      prefix: "konbini: "
    groups:
      base-images:
        patterns: ["*"]
