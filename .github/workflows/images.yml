# Public images on GitHub's registry: on each signed release tag (vX.Y.Z), build for amd64 and arm64, push
# ghcr.io/machiya-kobo/konbini:<version> (and :latest), and sign it with cosign keyless (Sigstore). Verify with:
#   cosign verify ghcr.io/machiya-kobo/konbini:<version> \
#     --certificate-identity-regexp '^https://github.com/machiya-kobo/konbini/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# The tag must be signed by a key in Machiya's release/allowed_signers, or nothing is built.
name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to build again (for example v1.2.3)"
        required: true

permissions:
  contents: read

concurrency:
  group: images-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # cosign keyless: the workflow's identity signs the image
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Version
        id: v
        run: |
          version=${TAG#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a vX.Y.Z release tag"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The tag is signed by a release key
        run: |
          curl -fsSL -o "$RUNNER_TEMP/allowed_signers" https://raw.githubusercontent.com/machiya-kobo/machiya/main/release/allowed_signers
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" tag -v "$TAG"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: app
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/machiya-kobo/konbini:${{ steps.v.outputs.version }}
            ghcr.io/machiya-kobo/konbini:latest
          labels: |
            org.opencontainers.image.title=konbini
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/machiya-kobo/konbini
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6   # v4.1.2
      - name: Sign the image (cosign keyless)
        env:
          IMAGE: ghcr.io/machiya-kobo/konbini@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
